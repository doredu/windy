<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="settings.css">
<script type="module" src="../dist/settings/settings.js"></script></head>
<body>
  <div id="updateBanner" class="update-banner hidden">
    <div class="update-banner-row">
      <span id="updateText" role="status"></span>
      <button type="button" id="updateAction"></button>
    </div>
    <p id="updateNotes" class="update-notes hidden"></p>
  </div>
  <div class="tabs" role="tablist">
    <button type="button" id="tab-general" class="tab active" data-tab="general" role="tab" aria-selected="true" aria-controls="panel-general" tabindex="0">General</button>
    <button type="button" id="tab-storage" class="tab" data-tab="storage" role="tab" aria-selected="false" aria-controls="panel-storage" tabindex="-1">Storage</button>
    <button type="button" id="tab-appearance" class="tab" data-tab="appearance" role="tab" aria-selected="false" aria-controls="panel-appearance" tabindex="-1">Appearance</button>
    <button type="button" id="tab-advanced" class="tab" data-tab="advanced" role="tab" aria-selected="false" aria-controls="panel-advanced" tabindex="-1">Advanced</button>
  </div>
  <form id="form">
    <section id="panel-general" class="tab-panel active" data-panel="general" role="tabpanel" aria-labelledby="tab-general">
      <label class="checkbox-field">
        <input id="startWithWindows" type="checkbox">
        Start with Windows
      </label>
      <div class="field">
        <label for="hotkey">Toggle hotkey</label>
        <div class="hotkey-row">
          <input id="hotkey" type="text" readonly placeholder="Click Record and press keys">
          <button type="button" id="hotkeyRecord">Record</button>
        </div>
        <span id="hotkeyError" class="field-error" role="alert"></span>
        <span class="field-hint">Click Record, then press a modifier (Ctrl/Alt/Shift) plus a letter or digit</span>
      </div>
      <label class="checkbox-field">
        <input id="autoCheckUpdates" type="checkbox">
        Automatically check for updates
      </label>
    </section>

    <section id="panel-storage" class="tab-panel" data-panel="storage" role="tabpanel" aria-labelledby="tab-storage">
      <div class="field">
        <label for="maxItems">Max items</label>
        <input id="maxItems" type="number" min="1" placeholder="Unlimited">
      </div>
      <div class="field">
        <label for="retentionDays">Retention (days)</label>
        <input id="retentionDays" type="number" min="1" placeholder="Unlimited">
      </div>
      <span id="storageError" class="field-error" role="alert"></span>
      <div class="field">
        <label for="sortMode">Sort by</label>
        <select id="sortMode">
          <option value="last_copied">Time of last copy</option>
          <option value="first_copied">Time of first copy</option>
          <option value="most_copied">Number of copies</option>
        </select>
      </div>
      <div class="field">
        <label>Save to history</label>
        <label class="checkbox-field"><input id="captureText" type="checkbox"> Text</label>
        <label class="checkbox-field"><input id="captureImage" type="checkbox"> Images</label>
        <label class="checkbox-field"><input id="captureFiles" type="checkbox"> Files</label>
        <label class="checkbox-field"><input id="captureRichtext" type="checkbox"> Rich text</label>
        <span id="captureError" class="field-error" role="alert"></span>
      </div>
      <div class="field">
        <label>Danger zone</label>
        <button type="button" id="clearHistoryBtn" class="danger-btn">Clear all history</button>
        <span id="clearHistoryStatus" class="field-hint" role="status"></span>
      </div>
    </section>

    <section id="panel-appearance" class="tab-panel" data-panel="appearance" role="tabpanel" aria-labelledby="tab-appearance">
      <div class="field">
        <label for="popupOpacity">Popup opacity <span id="popupOpacityValue"></span></label>
        <div class="control-row">
          <input id="popupOpacity" type="range" min="30" max="100" step="1">
          <button type="button" id="resetOpacity" class="reset-btn" title="Reset to default (90%)">Reset</button>
        </div>
      </div>
      <div class="field">
        <label for="popupBgColor">Popup background color <span id="popupBgColorValue" class="hex-value"></span></label>
        <div class="control-row">
          <input id="popupBgColor" type="color">
          <button type="button" id="resetBgColor" class="reset-btn" title="Reset to default (#1E1E22)">Reset</button>
        </div>
      </div>
      <div class="field">
        <label for="popupAccentColor">Popup accent color <span id="popupAccentColorValue" class="hex-value"></span></label>
        <div class="control-row">
          <input id="popupAccentColor" type="color">
          <button type="button" id="resetAccentColor" class="reset-btn" title="Reset to default (#FFFFFF)">Reset</button>
        </div>
      </div>
      <div class="field">
        <label for="popupPosition">Position</label>
        <select id="popupPosition">
          <option value="cursor">At cursor</option>
          <option value="window_center">Center of active window</option>
          <option value="screen_center">Center of screen</option>
          <option value="bottom_right">Bottom-right corner</option>
        </select>
      </div>
      <div class="field">
        <label for="popupPin">Pin</label>
        <select id="popupPin">
          <option value="bottom">Below position</option>
          <option value="top">Above position</option>
        </select>
        <span class="field-hint">Whether the popup opens below or above the chosen Position point</span>
      </div>
    </section>

    <section id="panel-advanced" class="tab-panel" data-panel="advanced" role="tabpanel" aria-labelledby="tab-advanced">
      <label class="checkbox-field">
        <input id="clearHistoryOnQuit" type="checkbox">
        Clear history on quit
      </label>
      <label class="checkbox-field">
        <input id="clearClipboardOnQuit" type="checkbox">
        Clear system clipboard too
      </label>
      <span class="field-hint">Only applies when "Clear history on quit" is enabled above</span>
    </section>

    <div class="actions">
      <button type="submit" id="saveBtn">Save</button>
      <span id="status" role="status">Saved</span>
      <span id="unsavedIndicator" class="unsaved-indicator">Unsaved changes</span>
    </div>
  </form>
</body></html>
